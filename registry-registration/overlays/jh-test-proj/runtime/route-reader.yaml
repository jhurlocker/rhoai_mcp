apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-registry-route-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [route.openshift.io]
    resources: [routes]
    resourceNames: [rhoai-mcp]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-registry-route-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: mcp-registry-publisher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-registry-route-reader

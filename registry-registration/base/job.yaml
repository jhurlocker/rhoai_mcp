apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-registry-registration
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-registry-registration
    spec:
      restartPolicy: Never
      serviceAccountName: mcp-registry-publisher
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: register
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: [python3, /runner/runner.py, --apply]
          envFrom:
            - configMapRef: {name: mcp-registry-settings}
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: runner, mountPath: /runner, readOnly: true}
            - {name: data, mountPath: /data, readOnly: true}
            - {name: trust, mountPath: /trust, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runner
          configMap: {name: mcp-registry-runner}
        - name: data
          configMap: {name: mcp-registry-data}
        - name: trust
          configMap: {name: mcp-registry-service-ca}
        - name: tmp
          emptyDir: {}
